{{- if not .Date.IsZero -}}
{{- if .Params.dateApprox -}}
<time class="date" datetime="{{ .Date.Format "2006" }}">~{{ .Date.Format "2006" }}</time>
{{- else -}}
<time class="date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format (site.Params.dateFormat | default "2006-01-02") }}</time>
{{- end -}}
{{- end -}}
